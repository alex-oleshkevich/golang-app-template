name: nisaba

services:
  nisaba:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT: ${APP_COMMIT:-unknown}
    image: nisaba:{{gitsha 7}}
    command: ["serve", "--address", "0.0.0.0", "--port", "8080", "--db-migrate"]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    # SQLite WAL writes -wal/-shm beside the db, so the whole dir must be writable, not just the file.
    volumes:
      - nisaba-data:/data
    x-ports:
      - ${APP_DOMAIN:?set APP_DOMAIN}:8080/https
    healthcheck:
      test: ["CMD", "/nisaba", "health", "--port", "8080"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  nisaba-data:
