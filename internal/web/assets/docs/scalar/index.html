<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nisaba API (Scalar)</title>
</head>
<body>
    <div id="app"></div>
    <script src="1.72.4/standalone.js"></script>
    <script>
        // No third-party hosts: Scalar otherwise loads fonts, proxies requests and sends telemetry.
        Scalar.createApiReference('#app', {
            url: '/api/v1/openapi.json',
            withDefaultFonts: false,
            proxyUrl: '',
            telemetry: false,
        })
    </script>
</body>
</html>
