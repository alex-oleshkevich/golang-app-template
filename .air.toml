#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
args_bin = ["serve", "--address", "127.0.0.1", "--port", "8080", "--docs"]
bin = "./tmp/nisaba"
cmd = "go build -o ./tmp/nisaba ./cmd/nisaba"
delay = 1000
exclude_dir = ["bin", "tmp", "vendor", "ui"]
exclude_regex = ["_test.go"]
include_ext = ["go", "yaml", "html", "tmpl", "tpl"]
kill_delay = "500ms"
send_interrupt = true
stop_on_error = true

[log]
time = false

[misc]
clean_on_exit = true
